<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 検索エンジンへのインデックスを拒否する設定 -->
    <meta name="robots" content="noindex, nofollow">
    <title>社労士 一問一答アプリ</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
            --success-color: #16a34a;
            --error-color: #dc2626;
            --ai-color: #7c3aed;
            --ai-hover: #6d28d9;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 1.3rem;
            margin: 0;
            color: var(--primary-color);
        }

        #stats-info {
            font-size: 0.85rem;
            color: #64748b;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 4px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 12px;
        }

        /* ローディング画面 */
        #loading-view {
            text-align: center;
            padding: 40px;
            font-size: 1.1rem;
            color: #64748b;
        }

/* フィルター・ダッシュボードエリア */
        .filter-section {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
            padding: 12px 16px;
        }
        .filter-section h3 {
            font-size: 0.9rem;
            margin: 0 0 8px 0;
            color: #475569;
        }

        .rank-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        /* フィルターボタン（基本のデザイン） */
        .rank-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border: 1.5px solid #e5e7eb;
            background: #f9fafb;
            color: #374151;
            transition: all 0.2s;
        }

        .rank-badge .count-badge {
            font-size: 0.7rem;
            opacity: 0.8;
            font-weight: normal;
        }

        /* --- ランクごとの色分け設定 --- */
        .rank-badge[data-rank="ALL"].active { background: #1f2937; color: white; border-color: #1f2937; }

        .rank-badge[data-rank="A"] { border-color: #10b981; color: #047857; }
        .rank-badge[data-rank="A"].active { background: #10b981; color: white; }

        .rank-badge[data-rank="B"] { border-color: #3b82f6; color: #1d4ed8; }
        .rank-badge[data-rank="B"].active { background: #3b82f6; color: white; }

        .rank-badge[data-rank="C"] { border-color: #f59e0b; color: #b45309; }
        .rank-badge[data-rank="C"].active { background: #f59e0b; color: white; }

        .rank-badge[data-rank="D"] { border-color: #f97316; color: #c2410c; }
        .rank-badge[data-rank="D"].active { background: #f97316; color: white; }

        .rank-badge[data-rank="F"] { border-color: #6b7280; color: #374151; }
        .rank-badge[data-rank="F"].active { background: #6b7280; color: white; }


       /* --- 下部の横棒グラフ（プログレスバー）のデザイン --- */

/* バー全体の外枠（背景色をここに持たせるのが確実です） */
.rank-progress-wrapper {
    width: 100%;
    height: 10px;
    background: #e5e7eb; /* データがない時や余白の背景色 */
    border-radius: 5px;
    overflow: hidden;
    display: flex;
}

/* JavaScriptで動的にセグメントを並べるコンテナ */
.rank-progress-bar {
    display: flex;
    width: 100%;
    height: 100%;
}

/* 各ランクのバーパーツ */
.progress-segment {
    height: 100%;
    transition: width 0.3s ease;
}

        /* 横棒グラフのランク別カラー */
        .progress-segment.rank-A { background-color: #10b981; }
        .progress-segment.rank-B { background-color: #3b82f6; }
        .progress-segment.rank-C { background-color: #f59e0b; }
        .progress-segment.rank-D { background-color: #f97316; }
        .progress-segment.rank-F { background-color: #9ca3af; }

        /* アコーディオン形式の出題範囲セクション */
        .tree-toggle-header {
            font-size: 0.9rem;
            font-weight: bold;
            color: var(--primary-color);
            cursor: pointer;
            background: #eff6ff;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #bfdbfe;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .tree-toggle-header:hover {
            background: #dbeafe;
        }

        .tree-container {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 6px 6px;
            padding: 10px;
            background: #fff;
            display: none;
        }
        .tree-container.open {
            display: block;
        }

        .chapter-label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            margin-top: 6px;
            margin-bottom: 3px;
            cursor: pointer;
            color: #1e293b;
        }
        .section-label {
            display: block;
            font-size: 0.8rem;
            margin-left: 18px;
            margin-bottom: 2px;
            cursor: pointer;
            color: #475569;
        }

        /* AI分析用ボタン */
        .ai-export-container {
            margin-top: 10px;
        }
        .btn-ai {
            background: var(--ai-color);
            color: white;
            width: 100%;
            font-size: 0.85rem;
            padding: 6px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-ai:hover {
            background: var(--ai-hover);
        }

        /* 問題カード */
        .question-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 8px;
            background: #f8fafc;
            padding: 6px 10px;
            border-radius: 6px;
            align-items: center;
        }

        /* ヒント関連 */
        .hint-btn-container {
            margin-bottom: 8px;
        }
        .btn-hint {
            background: #fef3c7;
            color: #92400e;
            border: 1px solid #fde68a;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-hint:hover {
            background: #fde68a;
        }
        .hint-box {
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 6px;
            padding: 10px;
            font-size: 0.85rem;
            color: #78350f;
            margin-bottom: 10px;
            display: none;
        }

        .question-text {
            font-size: 1rem;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        /* メモ欄 */
        .memo-container {
            margin-bottom: 12px;
        }
        .memo-container label {
            display: block;
            font-size: 0.8rem;
            font-weight: bold;
            color: #475569;
            margin-bottom: 2px;
        }
        .memo-textarea {
            width: 100%;
            height: 45px;
            padding: 6px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.85rem;
            resize: vertical;
            box-sizing: border-box;
        }
        .memo-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* 〇×ボタン */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-true {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
        .btn-true:hover:not(:disabled) {
            background: #bbf7d0;
        }

        .btn-false {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        .btn-false:hover:not(:disabled) {
            background: #fecaca;
        }

        /* 解答後のボタン強調スタイル */
        .btn.user-choice {
            box-shadow: 0 0 0 3px #0f172a !important; /* 自分の選んだ答えを濃い枠線で強調 */
        }
        .btn.correct-highlight {
            border: 3px solid var(--success-color) !important; /* 正解のボタンを緑の太枠で強調 */
        }
        .btn:disabled {
            cursor: default;
        }

        /* 結果・解説エリア */
        .result-box {
            margin-bottom: 12px;
            display: none;
        }

        .quick-feedback {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 6px;
        }
        .quick-feedback.correct { color: var(--success-color); }
        .quick-feedback.incorrect { color: var(--error-color); }

        .explanation-text {
            font-size: 0.85rem;
            line-height: 1.4;
            color: #334155;
            background: #f8fafc;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            max-height: 120px;
            overflow-y: auto;
        }

        /* ランク手動変更エリア */
        .rank-change-box {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 12px;
            background: #f8fafc;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        .rank-change-box span {
            font-size: 0.8rem;
            font-weight: bold;
            color: #475569;
        }
        .rank-btn {
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: #fff;
            transition: all 0.2s;
        }
        .rank-btn.current {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        /* 次へボタン */
        .next-btn {
            background: var(--primary-color);
            color: white;
            width: 100%;
            font-size: 0.95rem;
            padding: 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .next-btn:hover {
            background: var(--primary-hover);
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>社労士 一問一答</h1>
        <div id="stats-info">読み込み中...</div>
    </header>

    <!-- ローディング画面 -->
    <div id="loading-view" class="card">
        <p>データをクラウドから取得しています...</p>
    </div>

    <!-- アプリ本体 -->
    <div id="app-view" class="hidden">
       <!-- フィルター設定カード -->
    <div class="card filter-section">
        <h3>ランクフィルター</h3>
        
        <!-- 1. フィルターボタンが並ぶ場所（idはプログラムに合わせて "rank-filters" のままにしています） -->
        <div class="rank-badges" id="rank-filters">
            <span class="rank-badge active" data-rank="ALL">すべて</span>
            <span class="rank-badge" data-rank="A">A 完璧 <span id="count-A">0</span></span>
            <span class="rank-badge" data-rank="B">B 安心 <span id="count-B">0</span></span>
            <span class="rank-badge" data-rank="C">C 不安 <span id="count-C">0</span></span>
            <span class="rank-badge" data-rank="D">D 不正解 <span id="count-D">0</span></span>
            <span class="rank-badge" data-rank="F">F 未回答 <span id="count-F">0</span></span>
        </div>

        <!-- 2. 【新しく追加】ボタンの下に、全ランクの割合がひと目でわかる横棒グラフの箱 -->
        <div class="rank-progress-wrapper">
            <div class="rank-progress-bar" id="rankProgressBar">
                <!-- ここにJavaScriptが、カラフルな横棒グラフのパーツを自動で作ってくれます -->
            </div>
        </div>
    </div>

            <!-- 出題範囲（アコーディオン式） -->
            <div class="tree-toggle-header" onclick="toggleTreeContainer()">
                <span>📁 出題範囲（章・項目）を選択する</span>
                <span id="tree-arrow">▼</span>
            </div>
            <div class="tree-container" id="checkbox-tree">
                <!-- 動的に生成されます -->
            </div>

            <div class="ai-export-container">
                <button class="btn-ai" onclick="copyLearningDataForAI()">🤖 AI分析用に学習データをコピー</button>
            </div>
        </div>

        <!-- 問題出題カード -->
        <div class="card" id="question-card">
            <div class="question-meta">
                <span id="q-id-info">ID: -</span>
                <span id="q-progress">0 / 0 問</span>
            </div>
            
            <!-- ヒントエリア -->
            <div class="hint-btn-container" id="hint-container">
                <button class="btn-hint" onclick="toggleHint()">💡 ヒントを見る</button>
            </div>
            <div class="hint-box" id="hint-box">
                ヒント文がここに表示されます。
            </div>

            <div class="question-text" id="q-text">
                問題文がここに表示されます。
            </div>

            <!-- メモ欄 -->
            <div class="memo-container">
                <label for="memo-input">✏️ メモ:</label>
                <textarea id="memo-input" class="memo-textarea" placeholder="メモを入力..." oninput="updateMemo(this.value)"></textarea>
            </div>

            <!-- 〇×ボタン (idを追加して状態制御に対応) -->
            <div class="action-buttons" id="choice-buttons">
                <button class="btn btn-true" id="btn-true-choice" onclick="answerQuestion(true)">〇</button>
                <button class="btn btn-false" id="btn-false-choice" onclick="answerQuestion(false)">×</button>
            </div>

            <!-- 正誤結果 ＋ 解説エリア -->
            <div class="result-box" id="result-box">
                <div id="quick-feedback" class="quick-feedback"></div>
                <div class="explanation-text" id="q-explanation">解説文がここに表示されます。</div>
            </div>

            <!-- ランク手動変更エリア -->
            <div class="rank-change-box">
                <span>ランク変更:</span>
                <button class="rank-btn" data-changer="A" onclick="changeRank('A')">A 完璧</button>
                <button class="rank-btn" data-changer="B" onclick="changeRank('B')">B 安心</button>
                <button class="rank-btn" data-changer="C" onclick="changeRank('C')">C 不安</button>
                <button class="rank-btn" data-changer="D" onclick="changeRank('D')">D 不正解</button>
                <button class="rank-btn" data-changer="F" onclick="changeRank('F')">F 未回答</button>
            </div>

            <!-- 次へボタン -->
            <button class="btn next-btn" onclick="nextQuestion()">次の問題へ ➔</button>
        </div>
    </div>
</div>

    function getChapterName(rawCh) {
        let key = String(rawCh || "").replace(/[^0-9]/g, "");
        return CHAPTER_NAMES[key] || rawCh;
    }

    function getSectionName(rawCh, rawSec) {
        let chKey = String(rawCh || "").replace(/[^0-9]/g, "");
        let secKey = String(rawSec || "").trim();
        if (SECTION_NAMES[chKey] && SECTION_NAMES[chKey][secKey]) {
            return SECTION_NAMES[chKey][secKey];
        }
        return rawSec;
    }

    window.addEventListener("DOMContentLoaded", () => {
        fetchData();
    });

    function toggleTreeContainer() {
        const container = document.getElementById("checkbox-tree");
        const arrow = document.getElementById("tree-arrow");
        container.classList.toggle("open");
        if (container.classList.contains("open")) {
            arrow.innerText = "▲";
        } else {
            arrow.innerText = "▼";
        }
    }

    function fetchData() {
        if (!WEB_APP_URL || WEB_APP_URL.includes("ここに")) {
            document.getElementById("loading-view").innerHTML = "<p style='color:red;'>エラー: GASのWEB_APP_URLが正しく設定されていません。</p>";
            return;
        }

        fetch(WEB_APP_URL)
            .then(response => response.json())
            .then(data => {
                allQuestions = data;
                document.getElementById("loading-view").classList.add("hidden");
                document.getElementById("app-view").classList.remove("hidden");
                
                initFilters();
                updateRankCounts();
                applyFilters();
            })
            .catch(error => {
                console.error("データ取得エラー:", error);
                document.getElementById("loading-view").innerHTML = "<p style='color:red;'>データの取得に失敗しました。再読み込みしてください。</p>";
            });
    }

    function updateRankCounts() {
        const counts = { A: 0, B: 0, C: 0, D: 0, F: 0 };
        
        allQuestions.forEach(q => {
            const rank = (q.rank || "F").trim().toUpperCase();
            if (counts[rank] !== undefined) {
                counts[rank]++;
            } else {
                counts['F']++;
            }
        });

        for (const [rank, count] of Object.entries(counts)) {
            const el = document.getElementById(`count-${rank}`);
            if (el) {
                el.innerText = `(${count})`;
            }
        }

        // ★ここから下が、横棒プログレスバーを自動で組み立てる新しい処理です
        const progressBar = document.getElementById('rankProgressBar');
        if (progressBar) {
            progressBar.innerHTML = ''; // 一旦きれいにする

            const total = allQuestions.length; // 全問題数
            if (total > 0) {
                // CSSのクラス名に合わせたランクの順番
                const ranks = ['A', 'B', 'C', 'D', 'F'];
                
                ranks.forEach(rank => {
                    const count = counts[rank];
                    if (count > 0) {
                        const percentage = (count / total) * 100;

                        // グラフのパーツ（div）を作る
                        const segment = document.createElement('div');
                        // HTML/CSS側で用意したクラス名を付与（例: progress-segment rank-A）
                        segment.className = `progress-segment rank-${rank}`;
                        // 幅（%）を設定
                        segment.style.width = `${percentage.toFixed(1)}%`;
                        // マウスを乗せたときに詳細が出るようにする
                        segment.title = `${rank}ランク: ${count}件 (${percentage.toFixed(1)}%)`;

                        // グラフの箱に追加
                        progressBar.appendChild(segment);
                    }
                });
            }
        }
        // ★ここまで
    }

    function initFilters() {
        const treeContainer = document.getElementById("checkbox-tree");
        treeContainer.innerHTML = "";

        const structure = {};
        allQuestions.forEach(q => {
            let rawCh = q.chapter || "未分類";
            let rawSec = q.section || "未分類";

            let chName = getChapterName(rawCh);
            let secName = getSectionName(rawCh, rawSec);

            if (!structure[chName]) structure[chName] = new Set();
            structure[chName].add(secName);
        });

        selectedSections.clear();

        const sortedChapters = Object.keys(structure).sort((a, b) => {
            let numA = parseInt(a.replace(/[^0-9]/g, "")) || 999;
            let numB = parseInt(b.replace(/[^0-9]/g, "")) || 999;
            return numA - numB;
        });

        sortedChapters.forEach(ch => {
            const sections = Array.from(structure[ch]).sort((a, b) => {
                let numA = parseFloat(a.replace(/[^0-9.-]/g, "")) || 0;
                let numB = parseFloat(b.replace(/[^0-9.-]/g, "")) || 0;
                return numA - numB;
            });

            const chLabel = document.createElement("label");
            chLabel.className = "chapter-label";
            chLabel.innerHTML = `<input type="checkbox" class="chapter-check" value="${ch}" checked onchange="onChapterChange(this)"> 📁 ${ch}`;
            treeContainer.appendChild(chLabel);

            const secContainer = document.createElement("div");
            secContainer.style.marginLeft = "12px";

            sections.forEach(sec => {
                const key = `${ch}_${sec}`;
                selectedSections.add(key);

                const secLabel = document.createElement("label");
                secLabel.className = "section-label";
                secLabel.innerHTML = `<input type="checkbox" class="section-check" data-chapter="${ch}" value="${sec}" checked onchange="onSectionChange()"> 📄 ${sec}`;
                secContainer.appendChild(secLabel);
            });

            treeContainer.appendChild(secContainer);
        });

        document.querySelectorAll(".rank-badge").forEach(badge => {
            badge.addEventListener("click", (e) => {
                const targetBadge = e.target.closest(".rank-badge");
                if (!targetBadge) return;

                const rank = targetBadge.getAttribute("data-rank");
                if (rank === "ALL") {
                    selectedRanks.clear();
                    selectedRanks.add("ALL");
                    document.querySelectorAll(".rank-badge").forEach(b => b.classList.remove("active"));
                    targetBadge.classList.add("active");
                } else {
                    selectedRanks.delete("ALL");
                    document.querySelector('[data-rank="ALL"]').classList.remove("active");
                    
                    if (selectedRanks.has(rank)) {
                        selectedRanks.delete(rank);
                        targetBadge.classList.remove("active");
                        if (selectedRanks.size === 0) {
                            selectedRanks.add("ALL");
                            document.querySelector('[data-rank="ALL"]').classList.add("active");
                        }
                    } else {
                        selectedRanks.add(rank);
                        targetBadge.classList.add("active");
                    }
                }
                applyFilters();
            });
        });
    }

    function onChapterChange(chCheckbox) {
        const ch = chCheckbox.value;
        const isChecked = chCheckbox.checked;
        
        document.querySelectorAll(`.section-check[data-chapter="${ch}"]`).forEach(secCb => {
            secCb.checked = isChecked;
            const key = `${ch}_${secCb.value}`;
            if (isChecked) {
                selectedSections.add(key);
            } else {
                selectedSections.delete(key);
            }
        });
        applyFilters();
    }

    function onSectionChange() {
        selectedSections.clear();
        document.querySelectorAll(".section-check").forEach(secCb => {
            if (secCb.checked) {
                const ch = secCb.getAttribute("data-chapter");
                selectedSections.add(`${ch}_${secCb.value}`);
            }
        });
        applyFilters();
    }

    function applyFilters() {
        filteredQuestions = allQuestions.filter(q => {
            const qRank = (q.rank || "F").trim().toUpperCase();
            const matchRank = selectedRanks.has("ALL") || selectedRanks.has(qRank);
            
            let chName = getChapterName(q.chapter);
            let secName = getSectionName(q.chapter, q.section);
            const matchSection = selectedSections.has(`${chName}_${secName}`);

            return matchRank && matchSection;
        });

        currentIndex = 0;
        showQuestion();
    }

    function showQuestion() {
        const choiceBtns = document.getElementById("choice-buttons");
        const quickFeedback = document.getElementById("quick-feedback");
        const resultBox = document.getElementById("result-box");
        const hintBox = document.getElementById("hint-box");
        const memoInput = document.getElementById("memo-input");

        hintBox.style.display = "none";
        hintBox.innerText = "";
        quickFeedback.innerText = "";
        resultBox.style.display = "none";

        // ボタンの状態・ハイライトを初期化
        const btnTrue = document.getElementById("btn-true-choice");
        const btnFalse = document.getElementById("btn-false-choice");
        btnTrue.disabled = false;
        btnFalse.disabled = false;
        btnTrue.classList.remove("user-choice", "correct-highlight");
        btnFalse.classList.remove("user-choice", "correct-highlight");

        if (filteredQuestions.length === 0) {
            document.getElementById("q-id-info").innerText = "該当なし";
            document.getElementById("q-progress").innerText = "0 / 0 問";
            document.getElementById("q-text").innerText = "条件に一致する問題がありません。フィルター条件を変更してください。";
            choiceBtns.classList.add("hidden");
            resultBox.style.display = "none";
            memoInput.value = "";
            return;
        }

        if (currentIndex >= filteredQuestions.length) {
            currentIndex = 0;
        }

        currentQuestion = filteredQuestions[currentIndex];

        let chName = getChapterName(currentQuestion.chapter);
        let secName = getSectionName(currentQuestion.chapter, currentQuestion.section);

        document.getElementById("q-id-info").innerText = `ID: ${currentQuestion.id} | ${chName} ＞ ${secName} (ランク: ${currentQuestion.rank || "F"})`;
        document.getElementById("q-progress").innerText = `${currentIndex + 1} / ${filteredQuestions.length} 問`;
        document.getElementById("q-text").innerText = currentQuestion.text;

        memoInput.value = currentQuestion.memo || "";
        updateRankButtonUI(currentQuestion.rank || "F");

        if (currentQuestion.hint && currentQuestion.hint.trim() !== "") {
            hintBox.innerText = currentQuestion.hint;
        } else {
            hintBox.innerText = "この問題のヒントは登録されていません。";
        }
        
        choiceBtns.classList.remove("hidden");
        document.getElementById("stats-info").innerText = `対象: ${filteredQuestions.length}問`;
    }

    function updateMemo(val) {
        if (currentQuestion) {
            currentQuestion.memo = val;
        }
    }

    function changeRank(newRank) {
        if (currentQuestion) {
            currentQuestion.rank = newRank;
            updateRankButtonUI(newRank);
            let chName = getChapterName(currentQuestion.chapter);
            let secName = getSectionName(currentQuestion.chapter, currentQuestion.section);
            document.getElementById("q-id-info").innerText = `ID: ${currentQuestion.id} | ${chName} ＞ ${secName} (ランク: ${newRank})`;
            updateRankCounts();
        }
    }

    function updateRankButtonUI(activeRank) {
        document.querySelectorAll(".rank-btn").forEach(btn => {
            if (btn.getAttribute("data-changer") === activeRank.toUpperCase()) {
                btn.classList.add("current");
            } else {
                btn.classList.remove("current");
            }
        });
    }

    function toggleHint() {
        const hintBox = document.getElementById("hint-box");
        if (hintBox.style.display === "block") {
            hintBox.style.display = "none";
        } else {
            hintBox.style.display = "block";
        }
    }

    function answerQuestion(userAnswer) {
        const quickFeedback = document.getElementById("quick-feedback");
        const resultBox = document.getElementById("result-box");
        const qExplanation = document.getElementById("q-explanation");
        const hintBox = document.getElementById("hint-box");

        hintBox.style.display = "none";

        const btnTrue = document.getElementById("btn-true-choice");
        const btnFalse = document.getElementById("btn-false-choice");

        // 回答後はボタンをロック
        btnTrue.disabled = true;
        btnFalse.disabled = true;

        // 1. ユーザーが選んだボタンを強調
        if (userAnswer === true) {
            btnTrue.classList.add("user-choice");
        } else {
            btnFalse.classList.add("user-choice");
        }

        // 2. 正解のボタンを緑枠でハイライト
        if (currentQuestion.answer === true) {
            btnTrue.classList.add("correct-highlight");
        } else {
            btnFalse.classList.add("correct-highlight");
        }

        const isCorrect = (userAnswer === currentQuestion.answer);

        if (isCorrect) {
            currentQuestion.rank = "C"; // C 不安（正解時はCに更新等、既存仕様）
            quickFeedback.innerText = "正解！";
            quickFeedback.className = "quick-feedback correct";
        } else {
            currentQuestion.rank = "D"; // D 不正解
            quickFeedback.innerText = "不正解";
            quickFeedback.className = "quick-feedback incorrect";
        }

        qExplanation.innerText = currentQuestion.explanation || "解説はありません。";
        resultBox.style.display = "block";

        let chName = getChapterName(currentQuestion.chapter);
        let secName = getSectionName(currentQuestion.chapter, currentQuestion.section);
        document.getElementById("q-id-info").innerText = `ID: ${currentQuestion.id} | ${chName} ＞ ${secName} (ランク: ${currentQuestion.rank})`;
        
        updateRankButtonUI(currentQuestion.rank);
        updateRankCounts();
    }

    function nextQuestion() {
        if (!currentQuestion) return;

        const payload = {
            id: currentQuestion.id,
            rank: currentQuestion.rank || "F",
            memo: currentQuestion.memo || ""
        };

        fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
            console.log("クラウド保存成功:", res);
        })
        .catch(err => {
            console.error("クラウド保存失敗:", err);
        });

        currentIndex++;
        showQuestion();
    }

    function copyLearningDataForAI() {
        if (!allQuestions || allQuestions.length === 0) {
            alert("データが読み込まれていません。");
            return;
        }

        let exportText = "【社労士試験 一問一答 学習履歴データ】\n";
        exportText += "以下の私の学習状況を分析し、どの章・項目に弱点があるか、今後の対策アドバイスを教えてください。\n\n";

        allQuestions.forEach((q) => {
            let ch = getChapterName(q.chapter);
            let sec = getSectionName(q.chapter, q.section);
            let rank = q.rank || "F";
            let memo = q.memo ? `（メモ: ${q.memo}）` : "";

            exportText += `[ID: ${q.id}] ${ch} > ${sec} | ランク: ${rank} | 問題: ${q.text} ${memo}\n`;
        });

        navigator.clipboard.writeText(exportText).then(() => {
            alert("🤖 AI分析用の学習データをコピーしました！\nAIのチャット欄にそのまま貼り付けて（Ctrl+V等）分析を依頼してください。");
        }).catch(err => {
            console.error("コピー失敗:", err);
            alert("コピーに失敗しました。");
        });
    }
